# Everything runs with host networking so the Forge servers see players' real IP addresses
# (the login check compares them with the IP that pressed "Play ranked" on the website).
#
# Each image is built by exactly one service (forge-1, stream-1); the others reuse it.
# Several services building the same image tag at once makes Compose fail with
# "image ... already exists".
x-forge: &forge
  image: ranked-forge-server
  pull_policy: never
  network_mode: host
  restart: always          # each server exits after a match and comes back with a fresh lobby
  env_file: .env
  depends_on: [rewards]

x-stream: &stream
  image: ranked-forge-stream
  pull_policy: never
  restart: unless-stopped
  # No .env here: seats only get their slot number and the stream secret, never the
  # game-server secret or payout keys.
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g

services:
  rewards:
    build: ../rewards-server
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: 8080
      TRUST_PROXY: "1"
      DATABASE_PATH: /data/rewards.db
      GOALS_PATH: /config/goals.json
    volumes:
      - rewards-data:/data
      - ./goals.json:/config/goals.json:ro

  # Only used when the server has no web server of its own (install.sh decides; see
  # COMPOSE_PROFILES in .env). Otherwise the site is added to the system Caddy instead.
  caddy:
    image: caddy:2
    profiles: ["bundled-caddy"]
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [rewards]

  forge-1:
    <<: *forge
    build:
      context: ../forge-server
      target: server
    environment:
      FORGE_SERVER_ID: ranked-1
      FORGE_PORT: "36743"
      FORGE_PUBLIC_ADDRESS: ${PUBLIC_HOST}:36743
      REWARDS_URL: http://127.0.0.1:8080
    volumes: [forge-1:/root/.forge]

  # Second PvP server. Off by default to save ~1.5 GB RAM; enable it by adding "pvp2" to
  # COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=pvp2).
  forge-2:
    <<: *forge
    profiles: ["pvp2"]
    depends_on: [rewards, forge-1]
    environment:
      FORGE_SERVER_ID: ranked-2
      FORGE_PORT: "36744"
      FORGE_PUBLIC_ADDRESS: ${PUBLIC_HOST}:36744
      REWARDS_URL: http://127.0.0.1:8080
    volumes: [forge-2:/root/.forge]

  # One player against the Forge AI (random preconstructed deck). Add more by copying this
  # block with the next port; each server holds one match at a time and uses ~1.5 GB RAM.
  forge-ai-1:
    <<: *forge
    depends_on: [rewards, forge-1]
    environment:
      FORGE_SERVER_ID: vs-ai-1
      FORGE_MODE: ai
      FORGE_PORT: "36745"
      FORGE_PUBLIC_ADDRESS: ${PUBLIC_HOST}:36745
      REWARDS_URL: http://127.0.0.1:8080
    volumes: [forge-ai-1:/root/.forge]

  # Browser play: each seat runs the Forge desktop app for one player at a time and streams it
  # through noVNC. Seats sit on a private network with fixed addresses (the login check uses
  # them), publish only to localhost, and are reached through the rewards service, which checks
  # the player's session cookie. Each seat needs ~1.5-2 GB RAM. Keep STREAM_SLOTS in .env equal
  # to the number of seats defined here.
  stream-1:
    <<: *stream
    build:
      context: ../forge-server
      target: stream
    networks: { stream: { ipv4_address: 172.30.0.11 } }
    ports: ["127.0.0.1:6081:6080"]
    environment: { SLOT: "1", REWARDS_URL: "https://${DOMAIN}", STREAM_SECRET: "${STREAM_SECRET}" }
    volumes: [stream-1-cache:/home/player/.cache/forge]

  stream-2:
    <<: *stream
    depends_on: [stream-1]
    networks: { stream: { ipv4_address: 172.30.0.12 } }
    ports: ["127.0.0.1:6082:6080"]
    environment: { SLOT: "2", REWARDS_URL: "https://${DOMAIN}", STREAM_SECRET: "${STREAM_SECRET}" }
    volumes: [stream-2-cache:/home/player/.cache/forge]

networks:
  stream:
    driver: bridge
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]

volumes:
  rewards-data:
  caddy-data:
  forge-1:
  forge-2:
  forge-ai-1:
  stream-1-cache:
  stream-2-cache:
